<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Assessment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% include "accounts/partials/student_portal_styles.html" %}
</head>
<body class="teacher-parent-portal">
{% include "accounts/partials/student_portal_header.html" %}
<main class="container py-5" style="max-width: 900px">
    <h1 class="fw-bold">Create an assessment</h1>
    <p class="text-muted mb-4">Choose how you want to create and share it.</p>
    {% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}
    <form method="post" class="row g-3">
        {% csrf_token %}
        <div class="col-md-6">
            <button class="card card-body text-start h-100 w-100" type="submit" name="assessment_type" value="ASSIGNMENT">
                <span class="h3">Assignment</span>
                <span class="text-muted">Create work to upload directly to your students. You can save it as a draft first.</span>
            </button>
        </div>
        <div class="col-md-6">
            <button class="card card-body text-start h-100 w-100" type="submit" name="assessment_type" value="TEST">
                <span class="h3">Test</span>
                <span class="text-muted">Set up a test, add questions, then submit it for Admin review.</span>
            </button>
        </div>
    </form>
    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary mt-4">Back to dashboard</a>
</main>
</body>
</html>
