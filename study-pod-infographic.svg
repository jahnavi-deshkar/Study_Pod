<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">Study_Pod — How the portal works</title>
<desc id="desc">A vertical infographic showing teacher, student, and parent access to the Study_Pod school portal, academic services and assessments, plus a separate AI resource indexing and study support flow.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#A9501C"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#183451}.eyebrow{font-size:15px;font-weight:700;letter-spacing:2.8px}.title{font-size:58px;font-weight:800;letter-spacing:-1.5px}.subtitle{font-size:21px;font-weight:400}.section{font-size:16px;font-weight:700;letter-spacing:2px}.card-title{font-size:19px;font-weight:700}.body{font-size:15px}.small{font-size:13px}.tiny{font-size:12px}.stage{font-size:13px;font-weight:700;letter-spacing:1.3px}.step{font-size:24px;font-weight:800;fill:#A9501C}.label{font-size:13px;font-weight:700}
  </style>
</defs>
<!-- canvas -->
<rect width="1200" height="1600" fill="#F3ECDE"/>
<!-- header -->
<rect x="0" y="0" width="1200" height="292" fill="#183451"/>
<path d="M1035 0h165v165z" fill="#244762"/>
<path d="M1096 0h104v104z" fill="#A9501C"/>
<text x="74" y="62" class="eyebrow" fill="#F3ECDE" opacity=".78">A SCHOOL PORTAL, EXPLAINED</text>
<text x="70" y="151" class="title" fill="#F3ECDE">STUDY_POD</text>
<text x="74" y="196" class="subtitle" fill="#F3ECDE">One connected portal for school workflows</text>
<rect x="74" y="229" width="66" height="4" rx="2" fill="#A9501C"/>
<text x="157" y="237" class="small" fill="#F3ECDE" opacity=".85">TEACHERS  ·  STUDENTS  ·  PARENTS</text>
<!-- actors / portal entry -->
<text x="72" y="342" class="section">01 / PEOPLE ENTER THE PORTAL</text>
<g>
 <rect x="72" y="365" width="222" height="62" rx="10" fill="#FFFCF6" stroke="#183451" stroke-width="2"/>
 <circle cx="106" cy="396" r="17" fill="#183451"/><path d="M98 400c2-8 14-8 16 0M106 394a5 5 0 1 0 0-10a5 5 0 0 0 0 10" fill="none" stroke="#F3ECDE" stroke-width="2"/>
 <text x="136" y="402" class="card-title">Teacher</text>
 <rect x="327" y="365" width="222" height="62" rx="10" fill="#FFFCF6" stroke="#183451" stroke-width="2"/>
 <circle cx="361" cy="396" r="17" fill="#183451"/><path d="M353 400c2-8 14-8 16 0M361 394a5 5 0 1 0 0-10a5 5 0 0 0 0 10" fill="none" stroke="#F3ECDE" stroke-width="2"/>
 <text x="391" y="402" class="card-title">Student</text>
 <rect x="582" y="365" width="222" height="62" rx="10" fill="#FFFCF6" stroke="#183451" stroke-width="2"/>
 <circle cx="616" cy="396" r="17" fill="#183451"/><path d="M608 400c2-8 14-8 16 0M616 394a5 5 0 1 0 0-10a5 5 0 0 0 0 10" fill="none" stroke="#F3ECDE" stroke-width="2"/>
 <text x="646" y="402" class="card-title">Parent</text>
 <path d="M183 428v22h256M438 428v22M693 428v22h-255v18" fill="none" stroke="#A9501C" stroke-width="3" marker-end="url(#arrow)"/>
 <rect x="262" y="470" width="352" height="68" rx="12" fill="#183451"/>
 <text x="438" y="499" text-anchor="middle" class="card-title" fill="#F3ECDE">STUDY_POD PORTAL</text>
 <text x="438" y="521" text-anchor="middle" class="small" fill="#F3ECDE" opacity=".85">Sign in · role-based dashboards</text>
</g>
<!-- split into core services -->
<path d="M438 539v25H235v22M438 564v22M438 564h203v22" fill="none" stroke="#A9501C" stroke-width="3" marker-end="url(#arrow)"/>
<text x="72" y="615" class="section">02 / CORE SCHOOL WORKFLOWS</text>
<g>
 <rect x="72" y="638" width="350" height="184" rx="12" fill="#FFFCF6" stroke="#183451" stroke-width="2"/>
 <rect x="72" y="638" width="8" height="184" rx="4" fill="#A9501C"/>
 <text x="100" y="677" class="card-title">Academic services</text>
 <text x="100" y="710" class="body">Classes · attendance · timetables</text>
 <text x="100" y="735" class="body">Notices · resources · discussions</text>
 <text x="100" y="760" class="body">Leave · analytics</text>
 <text x="100" y="798" class="tiny" opacity=".68">TEACHER MANAGES  /  STUDENT USES  /  PARENT VIEWS</text>

 <rect x="443" y="638" width="350" height="184" rx="12" fill="#FFFCF6" stroke="#183451" stroke-width="2"/>
 <rect x="443" y="638" width="8" height="184" rx="4" fill="#A9501C"/>
 <text x="471" y="677" class="card-title">Assessments</text>
 <text x="471" y="710" class="body">Teacher creates and reviews</text>
 <text x="471" y="735" class="body">Student attempts and submits</text>
 <text x="471" y="760" class="body">Grades and results are recorded</text>
 <text x="471" y="798" class="tiny" opacity=".68">QUESTIONS · ATTEMPTS · ANSWERS · GRADES</text>

 <rect x="814" y="638" width="314" height="184" rx="12" fill="#FFFCF6" stroke="#183451" stroke-width="2"/>
 <rect x="814" y="638" width="8" height="184" rx="4" fill="#A9501C"/>
 <text x="842" y="677" class="card-title">Accounts &amp; roles</text>
 <text x="842" y="710" class="body">Sign-in and profiles</text>
 <text x="842" y="735" class="body">Role-aware access</text>
 <text x="842" y="760" class="body">Personalized dashboards</text>
 <text x="842" y="798" class="tiny" opacity=".68">TEACHER · STUDENT · PARENT</text>
</g>
<!-- database storage shared -->
<path d="M247 823v28h355M618 823v28M970 823v28H618v17" fill="none" stroke="#183451" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="422" y="868" width="392" height="62" rx="10" fill="#183451"/>
<ellipse cx="460" cy="899" rx="17" ry="13" fill="none" stroke="#F3ECDE" stroke-width="2"/><path d="M443 899v9c0 7 34 7 34 0v-9M443 899c0 7 34 7 34 0" fill="none" stroke="#F3ECDE" stroke-width="2"/>
<text x="490" y="896" class="card-title" fill="#F3ECDE">Application database</text>
<text x="490" y="916" class="tiny" fill="#F3ECDE" opacity=".82">Portal records and assessment data</text>
<!-- AI section -->
<rect x="48" y="970" width="1104" height="441" rx="18" fill="#EAE1D1"/>
<text x="78" y="1015" class="section">03 / AI STUDY SUPPORT</text>
<text x="78" y="1041" class="small" opacity=".75">Two connected paths: prepare class resources, then answer user queries with relevant context.</text>
<!-- index path -->
<text x="79" y="1084" class="stage">RESOURCE INDEXING</text>
<rect x="78" y="1101" width="226" height="78" rx="10" fill="#FFFCF6" stroke="#183451" stroke-width="2"/>
<text x="98" y="1132" class="label">01  RESOURCE FILE</text><text x="98" y="1156" class="small">Teacher uploads material</text>
<path d="M306 1140h44" stroke="#A9501C" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="360" y="1101" width="280" height="78" rx="10" fill="#FFFCF6" stroke="#183451" stroke-width="2"/>
<text x="381" y="1132" class="label">02  PREPARE CONTENT</text><text x="381" y="1156" class="small">Extract · chunk · embed</text>
<path d="M642 1140h44" stroke="#A9501C" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="696" y="1101" width="222" height="78" rx="10" fill="#FFFCF6" stroke="#183451" stroke-width="2"/>
<text x="717" y="1132" class="label">03  STORE INDEX</text><text x="717" y="1156" class="small">Local ChromaDB</text>
<rect x="948" y="1101" width="165" height="78" rx="10" fill="#183451"/>
<text x="1030" y="1132" text-anchor="middle" class="label" fill="#F3ECDE">UPLOADED</text><text x="1030" y="1156" text-anchor="middle" class="small" fill="#F3ECDE">FILES</text>
<path d="M918 1140h23" stroke="#A9501C" stroke-width="2" stroke-dasharray="4 4"/>
<!-- query path -->
<text x="79" y="1230" class="stage">USER QUERY</text>
<rect x="78" y="1247" width="245" height="86" rx="10" fill="#183451"/>
<text x="200" y="1282" text-anchor="middle" class="card-title" fill="#F3ECDE">Study request</text>
<text x="200" y="1307" text-anchor="middle" class="small" fill="#F3ECDE">Student or teacher</text>
<path d="M325 1290h50" stroke="#A9501C" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="386" y="1247" width="244" height="86" rx="10" fill="#FFFCF6" stroke="#183451" stroke-width="2"/>
<text x="508" y="1282" text-anchor="middle" class="card-title">Find context</text>
<text x="508" y="1307" text-anchor="middle" class="small">Relevant class passages</text>
<path d="M630 1290h48" stroke="#A9501C" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="688" y="1247" width="205" height="86" rx="10" fill="#A9501C"/>
<text x="790" y="1282" text-anchor="middle" class="card-title" fill="#F3ECDE">Groq model</text>
<text x="790" y="1307" text-anchor="middle" class="small" fill="#F3ECDE">Query + context</text>
<path d="M893 1290h48" stroke="#A9501C" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="951" y="1247" width="162" height="86" rx="10" fill="#FFFCF6" stroke="#183451" stroke-width="2"/>
<text x="1032" y="1282" text-anchor="middle" class="card-title">Response</text>
<text x="1032" y="1307" text-anchor="middle" class="small">Study support</text>
<!-- db retrieval connector -->
<path d="M807 1180v35h-300v28" fill="none" stroke="#183451" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<text x="654" y="1209" class="tiny" opacity=".72">retrieves matches</text>
<rect x="79" y="1361" width="1034" height="30" rx="7" fill="#F3ECDE"/>
<text x="96" y="1381" class="tiny"><tspan font-weight="700">OPTIONAL:</tspan> Web search can support selected AI requests.</text>
<text x="1090" y="1381" text-anchor="end" class="tiny" opacity=".7">AI features depend on configured services.</text>
<!-- footer -->
<text x="72" y="1463" class="section">BUILT FOR EVERYDAY SCHOOL WORK</text>
<line x1="72" y1="1485" x2="1128" y2="1485" stroke="#183451" stroke-width="1.5" opacity=".25"/>
<text x="74" y="1521" class="label">TECH</text><text x="74" y="1545" class="small">Python · Django · SQLite*</text>
<line x1="400" y1="1500" x2="400" y2="1560" stroke="#183451" opacity=".25"/>
<text x="430" y="1521" class="label">AI SUPPORT</text><text x="430" y="1545" class="small">ChromaDB · Groq · web search</text>
<rect x="825" y="1501" width="303" height="65" rx="9" fill="#A9501C"/>
<text x="847" y="1527" class="label" fill="#F3ECDE">ONE PORTAL</text><text x="847" y="1548" class="small" fill="#F3ECDE">School services + study support</text>
<text x="74" y="1582" class="tiny" opacity=".67">*SQLite is the local default. Uploaded files and the local AI index are stored separately.</text>
</svg>
