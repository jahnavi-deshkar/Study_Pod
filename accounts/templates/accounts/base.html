<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StudyPod{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --sp-primary: #2563eb;
            --sp-navy: #0f172a;
            --sp-background: #f8fafc;
            --sp-text: #1e293b;
            --sp-muted: #64748b;
            --sp-border: #e2e8f0;
        }

        body {
            background: var(--sp-background);
            color: var(--sp-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .navbar.bg-dark { background-color: var(--sp-navy) !important; }
        h1, h2, h3, h4, h5, h6 { color: var(--sp-navy); font-weight: 600; }
        .btn-primary { background-color: var(--sp-primary); border-color: var(--sp-primary); }
        .btn-primary:hover, .btn-primary:focus { background-color: #1d4ed8; border-color: #1d4ed8; }
        .card { background-color: #fff; border: 1px solid var(--sp-border); border-radius: 12px; box-shadow: 0 2px 8px rgb(15 23 42 / 5%); }
        a:not(.btn):not(.navbar-brand) { color: var(--sp-primary); }
        .navbar a:not(.btn):not(.navbar-brand) { color: #fff; }
        .text-muted { color: var(--sp-muted) !important; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container d-flex justify-content-between">
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="navbar-brand fw-semibold">StudyPod</a>
                <div class="d-flex flex-wrap align-items-center gap-2">
                    <a href="{% url 'notices' %}" class="text-white text-decoration-none me-2">Notices</a>
                    <span class="text-white me-2">{{ user.get_full_name|default:user.username }}</span>
                    <a href="{% url 'profile' %}" class="btn btn-outline-light btn-sm">Profile</a>
                    <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
                </div>
            {% endif %}
        </div>
    </nav>

    <main class="container py-5">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
