<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set Up Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% include "accounts/partials/student_portal_styles.html" %}
</head>
<body class="teacher-parent-portal">
{% include "accounts/partials/student_portal_header.html" %}
<main class="container py-5" style="max-width: 760px">
    <h1 class="fw-bold">Set up a test</h1>
    <p class="text-muted mb-4">Add the test details, then you’ll go to the question editor.</p>
    {% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}
    <form method="post" class="card card-body shadow-sm">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label" for="testTitle">Title</label>
            <input id="testTitle" name="title" class="form-control" maxlength="200" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="testClass">Class</label>
            <select id="testClass" name="student_class" class="form-select" required>
                <option value="">Select class</option>
                {% for assignment in assignments %}<option value="{{ assignment.student_class_id }}">{{ assignment.student_class }}</option>{% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label" for="testSubject">Subject</label>
            <select id="testSubject" name="subject" class="form-select" required>
                <option value="">Select subject</option>
                {% for assignment in assignments %}<option value="{{ assignment.subject_id }}" data-class-id="{{ assignment.student_class_id }}">{{ assignment.subject }}</option>{% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label" for="testTotalMarks">Total marks</label>
            <input id="testTotalMarks" type="number" name="total_marks" class="form-control" min="1" required>
        </div>
        <div class="d-flex justify-content-between mt-2">
            <a href="{% url 'create_assessment' %}" class="btn btn-outline-secondary">Back</a>
            <button type="submit" class="btn btn-primary">Continue to questions</button>
        </div>
    </form>
</main>
<script>
    const classSelect = document.getElementById("testClass");
    const subjectSelect = document.getElementById("testSubject");
    const allSubjectOptions = [...subjectSelect.options].slice(1);
    classSelect.addEventListener("change", () => {
        const selectedClass = classSelect.value;
        subjectSelect.value = "";
        allSubjectOptions.forEach(option => {
            option.hidden = Boolean(selectedClass) && option.dataset.classId !== selectedClass;
        });
    });
</script>
</body>
</html>
